name: Build and Release Debian

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  ROS_DISTRO: humble
  UBUNTU_CODENAME: jammy

jobs:
  build-deb:
    runs-on: ubuntu-latest
    container:
      image: ros:humble-ros-core
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Build Tools
        run: |
          apt-get update && apt-get install -y \
            python3 \
            python3-bloom \
            python3-rosdep \
            fakeroot \
            dpkg-dev \
            debhelper

      - name: Initialize rosdep
        run: |
          rosdep init || true
          rosdep update
          apt-get update
          rosdep install --from-paths . --ignore-src -y

      - name: Patch package.xml version from git tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -e

          CLEAN_VERSION="${{ github.ref_name }}"
          CLEAN_VERSION="${CLEAN_VERSION#v}"

          echo "Patching package.xml version to: $CLEAN_VERSION"

          python3 <<EOF
          import xml.etree.ElementTree as ET

          path = "package.xml"
          tree = ET.parse(path)
          root = tree.getroot()

          version = root.find("version")
          if version is None:
              raise SystemExit("ERROR: No <version> element found in package.xml")

          version.text = "${CLEAN_VERSION}"
          tree.write(path, encoding="utf-8", xml_declaration=True)

          print("Updated package.xml version to ${CLEAN_VERSION}")
          EOF

      - name: Generate Debian Source
        run: |
          bloom-generate rosdebian \
            --os-name ubuntu \
            --os-version "$UBUNTU_CODENAME" \
            --ros-distro "$ROS_DISTRO"

      - name: Build Binary Package
        run: |
          fakeroot debian/rules binary
          mkdir -p artifacts
          mv ../*.deb ./artifacts/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ros-debian-package
          path: artifacts/*.deb

      - name: Upload to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: artifacts/*.deb
